[project]
name = "llm-adversarial-information-attacks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LuisMontenegro21", email = "83621697+LuisMontenegro21@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "langchain>=1.3,<1.4",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "memanto>=0.2.17",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "telemem>=1.10,<1.11",
]

[project.scripts]
llm-adversarial-information-attacks = "llm_adversarial_information_attacks:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
